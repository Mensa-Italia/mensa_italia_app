name: pipeline

# Pipeline unica del repo, secondo la convenzione dell'organizzazione
# (Mensa-Italia/.github, PIPELINE.md). Cosa succede lo decide il ref, non il
# nome del file:
#
#   pull_request / push su branch  -> check     controlli base, niente pubblicazione
#   push su main                   -> dev       base + immagine :dev
#   tag bX.Y.Z                     -> staging   base + immagine :staging + Play beta + TestFlight
#   tag vX.Y.Z                     -> release   base + scansioni complete + store + Release firmata
#   cron del lunedi                -> audit     solo scansioni complete
#
# Il livello lo calcola plan.yml: qui non si ricalcola mai.
#
# Sostituisce gli otto workflow precedenti: qa-kotlin, qa-web, qa-swift,
# qa-docker, qa-secrets, release, notify, rescue-flutter-prod.
#
# I job che pubblicano usano `if: !cancelled() && <result espliciti>` invece del
# gating implicito di `needs`. Motivo: `deep` gira solo a livello release e
# audit, quindi a staging risulta `skipped` e con il gating implicito
# trascinerebbe skipped anche i publish. Con i result espliciti la regola resta
# leggibile: `skipped` = non doveva girare, `failure` = cancello chiuso.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ['v*', 'b*']
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      tier:
        description: Livello da forzare a mano (serve per provare una release senza taggare).
        type: choice
        options: [check, dev, staging, release, audit]
        default: check

concurrency:
  group: pipeline-${{ github.ref }}
  # I tag non si annullano mai fra loro. Una release a meta' e' peggio di due
  # release in coda.
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

jobs:
  # ─── Livello ───────────────────────────────────────────────────────────────
  plan:
    uses: Mensa-Italia/.github/.github/workflows/plan.yml@main
    with:
      image: mensa-italia/mensa-web
      forced-tier: ${{ inputs.tier }}

  # ─── Controlli base: i comandi di questo repo ──────────────────────────────
  # Vengono da qa-kotlin.yml, qa-web.yml e qa-docker.yml, identici. Stanno in un
  # job solo perche' condividono il checkout, il JDK e la libreria KMP/JS: prima
  # ognuno dei tre la ricostruiva per conto suo.
  check:
    name: controlli
    needs: plan
    if: needs.plan.outputs.tier != 'audit'
    runs-on: ${{ vars.LINUX_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with: { distribution: temurin, java-version: '21' }

      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

      # --- Kotlin (da qa-kotlin.yml) ---
      - name: Install detekt-cli
        run: |
          curl -sSLO https://github.com/detekt/detekt/releases/download/v1.23.6/detekt-cli-1.23.6.zip
          unzip -q detekt-cli-1.23.6.zip

      - name: Run detekt
        run: |
          ./detekt-cli-1.23.6/bin/detekt-cli \
            --input shared/src/commonMain,shared/src/androidMain,shared/src/jsMain,androidApp/src/main \
            --config detekt.yml \
            --build-upon-default-config

      # --- Web (da qa-web.yml) ---
      # Qui la libreria KMP/JS e' quella vera, quindi lo stub che qa-web.yml
      # scriveva a mano per far girare ESLint senza gradle non serve piu'.
      - name: Build shared JS library
        run: ./gradlew :shared:jsBrowserProductionLibraryDistribution -Dorg.gradle.java.home="$JAVA_HOME" --no-daemon

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with: { node-version: '22' }

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - run: bun install --frozen-lockfile
        working-directory: webApp

      - name: Astro check (TS)
        run: bun astro check
        working-directory: webApp

      - name: ESLint
        run: bun run lint
        working-directory: webApp

      # --- Dockerfile (da qa-docker.yml) ---
      - uses: hadolint/hadolint-action@54c9adbab1582c2ef04b2016b760714a4bfde3cf # v3.1.0
        with:
          dockerfile: Dockerfile.web

  # ─── Controlli base, lato Swift (da qa-swift.yml) ──────────────────────────
  check-swift:
    name: controlli Swift
    needs: plan
    if: needs.plan.outputs.tier != 'audit'
    # macos-latest non ha equivalente self-hosted. continue-on-error finche' il
    # billing macOS e' bloccato: TOGLIERE `continue-on-error` quando si sblocca,
    # e aggiungere `needs.check-swift.result == 'success'` alle if dei job che
    # pubblicano.
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - run: brew install swiftlint
      - run: swiftlint lint --quiet iosApp/iosApp

  # ─── Scansioni indipendenti dal linguaggio ─────────────────────────────────
  # Segreti (gitleaks), vulnerabilita' note delle dipendenze (OSV) e SBOM:
  # stanno in scan.yml, identiche per tutta l'organizzazione.
  deep:
    needs: plan
    if: needs.plan.outputs.deep == 'true'
    permissions:
      contents: read
      # osv-scanner-reusable, chiamato da scan.yml, la richiede.
      security-events: write
    uses: Mensa-Italia/.github/.github/workflows/scan.yml@main

  # ─── CodeQL: resta locale ──────────────────────────────────────────────────
  # scan.yml non lo include: linguaggi e permessi sono specifici del repo.
  # Gira agli stessi livelli di `deep` (release e audit).
  codeql-js:
    name: CodeQL JS/TS
    needs: plan
    if: needs.plan.outputs.deep == 'true'
    runs-on: ${{ vars.LINUX_RUNNER || 'ubuntu-latest' }}
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: github/codeql-action/init@99df26d4f13ea111d4ec1a7dddef6063f76b97e9 # v4
        with: { languages: 'javascript-typescript', build-mode: 'none' }
      - uses: github/codeql-action/analyze@99df26d4f13ea111d4ec1a7dddef6063f76b97e9 # v4
        with: { category: '/language:javascript-typescript' }

  codeql-kotlin:
    name: CodeQL Kotlin
    needs: plan
    if: needs.plan.outputs.deep == 'true'
    runs-on: ${{ vars.LINUX_RUNNER || 'ubuntu-latest' }}
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with: { distribution: temurin, java-version: '21' }
      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
      - uses: github/codeql-action/init@99df26d4f13ea111d4ec1a7dddef6063f76b97e9 # v4
        with: { languages: 'java-kotlin', build-mode: 'autobuild' }
      - name: Build kotlin (best-effort)
        run: |
          ./gradlew :shared:compileKotlinAndroid :androidApp:compileDebugKotlin \
            -Dorg.gradle.java.home="$JAVA_HOME" --no-daemon || true
      - uses: github/codeql-action/analyze@99df26d4f13ea111d4ec1a7dddef6063f76b97e9 # v4
        with: { category: '/language:java-kotlin' }

  codeql-swift:
    name: CodeQL Swift
    needs: plan
    if: needs.plan.outputs.deep == 'true'
    # Vedi check-swift: continue-on-error per il blocco billing macOS, va tolto
    # quando si sblocca.
    runs-on: macos-latest
    continue-on-error: true
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: latest-stable
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with: { distribution: temurin, java-version: '21' }
      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
      - name: Install xcodegen
        run: brew install xcodegen
      - name: Build shared Release XCFramework (CodeQL needs the framework)
        run: |
          ./gradlew :shared:assembleSharedReleaseXCFramework \
            -Dorg.gradle.java.home="$JAVA_HOME" --no-daemon
      - name: Point project.yml to Release XCFramework
        run: |
          /usr/bin/sed -i '' \
            -e 's|/XCFrameworks/debug|/XCFrameworks/release|g' \
            -e 's|assembleSharedDebugXCFramework|assembleSharedReleaseXCFramework|g' \
            iosApp/project.yml
      - name: Generate xcodeproj
        working-directory: iosApp
        run: xcodegen generate
      - uses: github/codeql-action/init@99df26d4f13ea111d4ec1a7dddef6063f76b97e9 # v4
        with: { languages: 'swift', build-mode: 'manual' }
      - name: Build iOS (manual mode for CodeQL)
        run: |
          xcodebuild build \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            -allowProvisioningUpdates=NO || true
      - uses: github/codeql-action/analyze@99df26d4f13ea111d4ec1a7dddef6063f76b97e9 # v4
        with: { category: '/language:swift' }

  # ─── Immagine web su GHCR ──────────────────────────────────────────────────
  # I tag li ha gia' calcolati plan.yml. `prepare` costruisce la libreria
  # KMP/JS che Dockerfile.web si aspetta di trovare gia' pronta.
  image:
    needs: [plan, check, check-swift]
    if: >-
      !cancelled()
      && needs.plan.outputs.publish == 'true'
      && needs.check.result == 'success'
    permissions:
      contents: read
      packages: write
    uses: Mensa-Italia/.github/.github/workflows/image.yml@main
    with:
      image: mensa-italia/mensa-web
      tags: ${{ needs.plan.outputs.tags }}
      file: Dockerfile.web
      prepare: |
        export JAVA_HOME="${JAVA_HOME_21_X64:-$JAVA_HOME}"
        ./gradlew :shared:jsBrowserProductionLibraryDistribution \
          -Dorg.gradle.java.home="$JAVA_HOME" --no-daemon --stacktrace

  # ─── Redeploy dello stack dev (da notify.yml) ──────────────────────────────
  # Prima girava sul branch feat/mvp-testing-public, che pubblicava :dev.
  # Adesso :dev lo produce main, quindi il webhook segue main.
  notify:
    name: redeploy dev
    needs: [plan, image]
    if: >-
      !cancelled()
      && needs.plan.outputs.tier == 'dev'
      && needs.image.result == 'success'
    runs-on: ${{ vars.LINUX_RUNNER || 'ubuntu-latest' }}
    steps:
      - name: Trigger Portainer redeploy webhook
        env:
          WEBHOOK_URL: ${{ secrets.REDEPLOY_URL }}
        run: |
          code=$(curl -X POST -s -o /dev/null -w "%{http_code}" "$WEBHOOK_URL" --insecure)
          echo "HTTP $code"
          # Portainer ritorna 204 No Content sul webhook valido.
          if [ "$code" != "204" ] && [ "$code" != "200" ]; then
            echo "Webhook unexpected status: $code"
            exit 1
          fi

  # ─── versionCode per gli store ─────────────────────────────────────────────
  # Monotonico e sopra al legacy Flutter (~21M). Lo calcolava `prepare` nel
  # vecchio release.yml; sta in un job suo perche' lo leggono sia Android che
  # iOS e la formula deve restare scritta in un posto solo.
  version-code:
    name: versionCode
    needs: plan
    if: needs.plan.outputs.tier == 'staging' || needs.plan.outputs.tier == 'release'
    runs-on: ${{ vars.LINUX_RUNNER || 'ubuntu-latest' }}
    outputs:
      value: ${{ steps.c.outputs.value }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0
      - id: c
        run: |
          set -euo pipefail
          commit_count=$(git rev-list --count HEAD)
          echo "value=$((30000000 + commit_count))" >> "$GITHUB_OUTPUT"

  # ─── Android: AAB + APK firmati ────────────────────────────────────────────
  android:
    name: Android
    needs: [plan, check, check-swift, version-code]
    if: >-
      !cancelled()
      && needs.version-code.result == 'success'
      && needs.check.result == 'success'
    runs-on: ${{ vars.LINUX_RUNNER || 'ubuntu-latest' }}
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      VERSION_CODE: ${{ needs.version-code.outputs.value }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Write VERSION file (per gradle)
        run: |
          echo "$VERSION" > VERSION
          echo "Building Android v$VERSION (versionCode $VERSION_CODE)"

      - name: Setup JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

      - name: Decode signing keystore
        run: |
          mkdir -p androidApp/keystore
          echo "${{ secrets.KEY_JKS }}" | base64 -d > androidApp/keystore/release.jks
          file androidApp/keystore/release.jks

      - name: Build AAB + APK
        env:
          ANDROID_STORE_FILE: ${{ github.workspace }}/androidApp/keystore/release.jks
          ANDROID_STORE_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ALIAS_PASSWORD }}
          ANDROID_KEY_ALIAS: key
        run: |
          ./gradlew :androidApp:bundleRelease :androidApp:assembleRelease \
            -Dorg.gradle.java.home="$JAVA_HOME" \
            -PandroidVersionCodeOverride="$VERSION_CODE" \
            --no-daemon --stacktrace

      - name: Rename artifacts
        run: |
          cp androidApp/build/outputs/bundle/release/androidApp-release.aab "mensa-italia-v${VERSION}.aab"
          cp androidApp/build/outputs/apk/release/androidApp-release.apk "mensa-italia-v${VERSION}.apk"

      - name: Cleanup keystore
        if: always()
        run: rm -f androidApp/keystore/release.jks

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: android-artifacts
          path: |
            mensa-italia-v*.aab
            mensa-italia-v*.apk
          if-no-files-found: error
          retention-days: 7

  # ─── iOS: .ipa firmato per App Store ───────────────────────────────────────
  ios:
    name: iOS
    needs: [plan, check, check-swift, version-code]
    if: >-
      !cancelled()
      && needs.version-code.result == 'success'
      && needs.check.result == 'success'
    # Vedi check-swift: continue-on-error per il blocco billing macOS, va tolto
    # quando si sblocca.
    runs-on: macos-latest
    continue-on-error: true
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      VERSION_CODE: ${{ needs.version-code.outputs.value }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Select latest Xcode (project.yml usa iOS 26)
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: latest-stable

      - name: Setup JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Build shared Release XCFramework
        run: |
          ./gradlew :shared:assembleSharedReleaseXCFramework \
            -Dorg.gradle.java.home="$JAVA_HOME" \
            --no-daemon --stacktrace

      - name: Setup signing keychain
        env:
          P12_BASE64: ${{ secrets.APPLE_CERT_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.APPLE_PROVISION_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
          echo "::add-mask::$KEYCHAIN_PASSWORD"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')

          CERT_PATH="$RUNNER_TEMP/dist.p12"
          echo "$P12_BASE64" | base64 -d > "$CERT_PATH"
          security import "$CERT_PATH" -P "$P12_PASSWORD" -k "$KEYCHAIN_PATH" -A -t cert -f pkcs12
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" >/dev/null

          PROFILE_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILE_DIR"
          PROFILE_PATH="$PROFILE_DIR/build.mobileprovision"
          echo "$PROFILE_BASE64" | base64 -d > "$PROFILE_PATH"

          UUID=$(/usr/libexec/PlistBuddy -c "Print :UUID" /dev/stdin <<< "$(security cms -D -i "$PROFILE_PATH")")
          NAME=$(/usr/libexec/PlistBuddy -c "Print :Name" /dev/stdin <<< "$(security cms -D -i "$PROFILE_PATH")")
          mv "$PROFILE_PATH" "$PROFILE_DIR/${UUID}.mobileprovision"

          echo "PROFILE_UUID=$UUID" >> "$GITHUB_ENV"
          echo "PROFILE_NAME=$NAME" >> "$GITHUB_ENV"
          echo "::notice::Installed profile $NAME ($UUID)"

      - name: Patch project.yml (XCFramework release + manual signing iosApp only)
        run: |
          set -euo pipefail
          # 1) Punta al Release XCFramework
          /usr/bin/sed -i '' \
            -e 's|/XCFrameworks/debug|/XCFrameworks/release|g' \
            -e 's|assembleSharedDebugXCFramework|assembleSharedReleaseXCFramework|g' \
            iosApp/project.yml
          # 2) Manual signing + profile SOLO sul target iosApp. Passare questi
          #    flag via xcodebuild CLI li propaga a TUTTI i target del workspace
          #    incluse le SPM deps (Stripe, Firebase, GoogleUtilities, nanopb...)
          #    che NON supportano provisioning profile → archive fail.
          #    Scriverli nel project.yml li tiene scoped al target iosApp.
          brew install yq
          yq -i ".targets.iosApp.settings.base.CODE_SIGN_STYLE = \"Manual\"" iosApp/project.yml
          yq -i ".targets.iosApp.settings.base.PROVISIONING_PROFILE_SPECIFIER = \"$PROFILE_NAME\"" iosApp/project.yml
          yq -i ".targets.iosApp.settings.base.CODE_SIGN_IDENTITY = \"Apple Distribution\"" iosApp/project.yml
          grep -A4 "CODE_SIGN_STYLE\|PROVISIONING_PROFILE_SPECIFIER" iosApp/project.yml | head -10

      - name: Generate xcodeproj
        working-directory: iosApp
        run: xcodegen generate

      - name: Resolve SPM dependencies
        run: |
          xcodebuild -resolvePackageDependencies \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp

      - name: Archive
        run: |
          # Niente override CODE_SIGN_STYLE / PROFILE qui: stanno gia' nel
          # project.yml scoped al target iosApp. Solo MARKETING_VERSION e
          # CURRENT_PROJECT_VERSION che sono safe da propagare.
          xcodebuild archive \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/iosApp.xcarchive" \
            MARKETING_VERSION="$VERSION" \
            CURRENT_PROJECT_VERSION="$VERSION_CODE" \
            -allowProvisioningUpdates=NO

      - name: Export IPA
        run: |
          cat > "$RUNNER_TEMP/export-options.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store</string>
            <key>teamID</key><string>6WA5D3RJBU</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>it.mensa.app</key><string>${PROFILE_NAME}</string>
            </dict>
            <key>uploadSymbols</key><true/>
            <key>compileBitcode</key><false/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/iosApp.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/export-options.plist" \
            -exportPath "$RUNNER_TEMP/ipa"
          cp "$RUNNER_TEMP/ipa"/*.ipa "mensa-italia-v${VERSION}.ipa"

      - name: Cleanup keychain
        if: always()
        run: |
          [ -n "${KEYCHAIN_PATH:-}" ] && security delete-keychain "$KEYCHAIN_PATH" || true
          rm -f "$RUNNER_TEMP/dist.p12"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ios-ipa
          path: mensa-italia-v*.ipa
          if-no-files-found: error
          retention-days: 7

  # ─── Play Store ────────────────────────────────────────────────────────────
  # Niente esce prima dei controlli: a livello release il cancello comprende
  # anche `deep` e i CodeQL. A livello staging quei job non girano affatto e
  # risultano `skipped`, che qui vale come "non doveva girare".
  play:
    name: Play (${{ needs.plan.outputs.tier }})
    needs: [plan, check, check-swift, deep, codeql-js, codeql-kotlin, codeql-swift, android]
    if: >-
      !cancelled()
      && needs.android.result == 'success'
      && needs.check.result == 'success'
      && (needs.deep.result == 'success' || needs.deep.result == 'skipped')
      && (needs.codeql-js.result == 'success' || needs.codeql-js.result == 'skipped')
      && (needs.codeql-kotlin.result == 'success' || needs.codeql-kotlin.result == 'skipped')
      && (needs.codeql-swift.result == 'success' || needs.codeql-swift.result == 'skipped')
    runs-on: ${{ vars.LINUX_RUNNER || 'ubuntu-latest' }}
    steps:
      - name: Download AAB
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: android-artifacts

      - name: Map track for Play
        id: track_map
        env:
          TIER: ${{ needs.plan.outputs.tier }}
        run: |
          set -euo pipefail
          case "$TIER" in
            staging) play_track="beta" ;;
            release) play_track="production" ;;
            *)       echo "::error::Livello $TIER non pubblica su Play"; exit 1 ;;
          esac
          echo "play_track=$play_track" >> "$GITHUB_OUTPUT"

      - name: Upload to Play Store
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: it.mensa.app
          releaseFiles: mensa-italia-v${{ needs.plan.outputs.version }}.aab
          track: ${{ steps.track_map.outputs.play_track }}
          status: completed
          inAppUpdatePriority: 2

  # ─── TestFlight / App Store ────────────────────────────────────────────────
  testflight:
    name: iOS publish (${{ needs.plan.outputs.tier }})
    needs: [plan, check, check-swift, deep, codeql-js, codeql-kotlin, codeql-swift, ios]
    if: >-
      !cancelled()
      && needs.ios.result == 'success'
      && needs.check.result == 'success'
      && (needs.deep.result == 'success' || needs.deep.result == 'skipped')
      && (needs.codeql-js.result == 'success' || needs.codeql-js.result == 'skipped')
      && (needs.codeql-kotlin.result == 'success' || needs.codeql-kotlin.result == 'skipped')
      && (needs.codeql-swift.result == 'success' || needs.codeql-swift.result == 'skipped')
    # Vedi check-swift: continue-on-error per il blocco billing macOS, va tolto
    # quando si sblocca.
    runs-on: macos-latest
    continue-on-error: true
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      TIER: ${{ needs.plan.outputs.tier }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Select latest Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: latest-stable

      - name: Download IPA
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: ios-ipa

      - name: Setup ASC API key
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          KEY_B64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
        run: |
          mkdir -p ~/private_keys
          echo "$KEY_B64" | base64 -d > "$HOME/private_keys/AuthKey_${KEY_ID}.p8"

      - name: Install fastlane
        run: gem install fastlane --no-document

      - name: Write Fastfile
        run: |
          mkdir -p fastlane
          cat > fastlane/Fastfile <<'RUBY'
          default_platform(:ios)

          platform :ios do
            before_all do
              app_store_connect_api_key(
                key_id: ENV['ASC_KEY_ID'],
                issuer_id: ENV['ASC_ISSUER_ID'],
                key_filepath: ENV['ASC_KEY_PATH'],
                duration: 1200,
                in_house: false
              )
            end

            desc "Upload to TestFlight (internal only)"
            lane :alpha do
              upload_to_testflight(
                ipa: ENV['IPA_PATH'],
                skip_waiting_for_build_processing: false,
                skip_submission: true,
                changelog: "Build automatica #{ENV['VERSION']} (alpha)"
              )
            end

            desc "Upload to TestFlight + Test open group"
            lane :beta do
              upload_to_testflight(
                ipa: ENV['IPA_PATH'],
                skip_waiting_for_build_processing: false,
                distribute_external: true,
                groups: ["Test open"],
                changelog: "Build automatica #{ENV['VERSION']} (beta pubblica)",
                notify_external_testers: true
              )
            end

            desc "Upload + submit to App Store review"
            lane :production do
              upload_to_testflight(
                ipa: ENV['IPA_PATH'],
                skip_waiting_for_build_processing: false,
                skip_submission: true,
                changelog: "Build automatica #{ENV['VERSION']} (production)"
              )
              deliver(
                submit_for_review: true,
                automatic_release: true,
                force: true,
                skip_screenshots: true,
                skip_metadata: true,
                skip_app_version_update: false,
                precheck_include_in_app_purchases: false,
                submission_information: {
                  add_id_info_uses_idfa: false,
                  export_compliance_uses_encryption: false,
                  content_rights_contains_third_party_content: false
                }
              )
            end
          end
          RUBY

      - name: Run fastlane
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          IPA_PATH: ${{ github.workspace }}/mensa-italia-v${{ needs.plan.outputs.version }}.ipa
          FASTLANE_HIDE_CHANGELOG: '1'
          FASTLANE_DISABLE_COLORS: '1'
        run: |
          set -euo pipefail
          # staging -> lane beta, release -> lane production. La lane alpha resta
          # nel Fastfile ma nessun livello la seleziona.
          case "$TIER" in
            staging) lane="beta" ;;
            release) lane="production" ;;
            *)       echo "::error::Livello $TIER non pubblica su TestFlight"; exit 1 ;;
          esac
          # ASC_KEY_PATH va calcolato in shell — il context env: della workflow
          # NON conosce $HOME (lo deduce solo a runtime).
          export ASC_KEY_PATH="$HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          ls -la "$ASC_KEY_PATH"
          fastlane ios "$lane"

      - name: Cleanup ASC key
        if: always()
        run: rm -f "$HOME/private_keys/AuthKey_"*.p8

  # ─── Artefatti da allegare alla Release ────────────────────────────────────
  # release.yml firma un artefatto solo, quindi AAB/APK e IPA vanno uniti qui.
  bundle:
    name: artefatti Release
    needs: [plan, android, ios]
    if: >-
      !cancelled()
      && needs.plan.outputs.tier == 'release'
      && needs.android.result == 'success'
    runs-on: ${{ vars.LINUX_RUNNER || 'ubuntu-latest' }}
    steps:
      - name: Scarica AAB + APK
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: android-artifacts
          path: dist

      - name: Scarica IPA
        # Finche' i job macOS sono continue-on-error l'IPA puo' mancare: la
        # Release esce lo stesso con i soli artefatti Android.
        continue-on-error: true
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: ios-ipa
          path: dist

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-files
          path: dist
          if-no-files-found: error
          retention-days: 7

  # ─── Release firmata ───────────────────────────────────────────────────────
  publish:
    needs: [plan, check, check-swift, deep, codeql-js, codeql-kotlin, codeql-swift, image, bundle]
    if: >-
      !cancelled()
      && needs.plan.outputs.tier == 'release'
      && needs.check.result == 'success'
      && needs.deep.result == 'success'
      && needs.codeql-js.result == 'success'
      && needs.codeql-kotlin.result == 'success'
      && needs.image.result == 'success'
      && needs.bundle.result == 'success'
    permissions:
      contents: write
      id-token: write
    uses: Mensa-Italia/.github/.github/workflows/release.yml@main
    with:
      version: ${{ needs.plan.outputs.version }}
      artifact: release-files
      files: '*'
