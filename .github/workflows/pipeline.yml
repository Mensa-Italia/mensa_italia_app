name: pipeline

# Pipeline unica del repo, secondo la convenzione dell'organizzazione
# (Mensa-Italia/.github, PIPELINE.md). Cosa succede lo decide il ref, non il
# nome del file. Quello che questo repo ha davvero acceso:
#
#   pull_request verso main  -> check     detekt + segreti, niente pubblicazione
#   tag bX.Y.Z               -> staging   controlli + scansioni + Play beta + TestFlight
#   tag vX.Y.Z               -> release   tutto + Play production + App Store + Release firmata
#   workflow_dispatch        -> il livello che scegli
#
# `dev` (push su main) e `audit` (cron) plan.yml li sa calcolare, ma qui i
# trigger corrispondenti non ci sono: un push su main non fa partire niente.
# Erano legati all'immagine Docker, che non si costruisce piu'.
#
# Il livello lo calcola plan.yml: qui non si ricalcola mai.
#
# Sostituisce i workflow precedenti: qa-kotlin, qa-secrets, release,
# rescue-flutter-prod.
#
# I job che pubblicano usano `if: !cancelled() && <result espliciti>` invece del
# gating implicito di `needs`. Motivo: alcuni cancelli non girano a tutti i
# livelli, quindi risultano `skipped` e con il gating implicito trascinerebbero
# skipped anche i publish. Con i result espliciti la regola resta leggibile:
# `skipped` = non doveva girare, `failure` = cancello chiuso. Dove un cancello
# DEVE aver girato (deep prima di uno store o di una Release) la condizione e'
# `== 'success'` secco, senza scappatoia `|| skipped`.

# Questo repo pubblica SOLO le app mobili. Non c'e' piu' nessuna immagine
# Docker da costruire: il modulo `webApp/`, il `Dockerfile.web` e i job
# `image` / `image-release` / `notify` sono stati eliminati. Il sito resta a
# mensa-hub, che pubblica `ghcr.io/mensa-italia/mensa-web` per conto suo — ed
# e' anche il motivo per cui pubblicarlo anche da qui era sbagliato: la
# collisione sul tag :dev dell'11 agosto 2026 (run 31547011487).
#
# `plan` viene invocato senza input `image`, quindi non calcola tag GHCR: la
# pipeline e' tutta e solo mobile.
on:
  pull_request:
    branches: [main]
  push:
    # `b*` = beta (Play beta + TestFlight), `v*` = release (Play production +
    # App Store review + Release firmata).
    #
    # `v*` era escluso perche' avrebbe pubblicato anche l'immagine `:latest`,
    # collidendo con quella di mensa-hub. Quel motivo non esiste piu': la web
    # app e i job immagine sono stati eliminati e questo repo non tocca piu'
    # ghcr.
    tags: ['b*', 'v*']
  workflow_dispatch:
    inputs:
      tier:
        description: Livello da forzare a mano. `auto` = deciso dal ref, come un push normale.
        type: choice
        options: [auto, check, dev, staging, release, audit]
        # `auto` e non `check`: con un default che forza un livello, un dispatch
        # lanciato su un tag vX.Y.Z senza toccare il menu non pubblicherebbe
        # niente, perche' forced-tier vince sempre sul ref.
        default: auto

concurrency:
  group: pipeline-${{ github.ref }}
  # I tag non si annullano mai fra loro. Una release a meta' e' peggio di due
  # release in coda.
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

jobs:
  # ─── Livello ───────────────────────────────────────────────────────────────
  plan:
    uses: Mensa-Italia/.github/.github/workflows/plan.yml@main
    with:
      # Nessun input `image`: qui non si pubblicano immagini, quindi plan.yml
      # non deve calcolare nessun tag GHCR.
      #
      # `auto` -> stringa vuota: plan.yml decide dal ref. Scritto cosi' e non
      # con il ternario ovvio perche' in una espressione GitHub la stringa
      # vuota e' falsa e `x == 'auto' && '' || x` restituirebbe 'auto'.
      forced-tier: ${{ inputs.tier != 'auto' && inputs.tier || '' }}

  # ─── Controlli base: i comandi di questo repo ──────────────────────────────
  # Viene da qa-kotlin.yml. Con `webApp/` e `Dockerfile.web` eliminati non ci
  # sono piu' controlli web (astro check, ESLint) ne' hadolint: resta detekt,
  # l'unico linter che gira su Linux per questo repo.
  check:
    name: controlli
    needs: plan
    if: needs.plan.outputs.tier != 'audit'
    # Sui livelli che pubblicano si va su runner GitHub: il 12 agosto 2026 il
    # self-hosted ha fatto fallire due run di fila su download Gradle
    # (services.gradle.org e poi github.com:443 che non rispondeva), fermando
    # una pubblicazione gia' verificata. Sulle PR resta LINUX_RUNNER, dove una
    # rete ballerina costa solo un "Re-run jobs".
    runs-on: ${{ needs.plan.outputs.publish == 'true' && 'ubuntu-latest' || vars.LINUX_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with: { distribution: temurin, java-version: '21' }

      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

      # --- Kotlin (da qa-kotlin.yml) ---
      - name: Install detekt-cli
        run: |
          curl -sSLO https://github.com/detekt/detekt/releases/download/v1.23.6/detekt-cli-1.23.6.zip
          unzip -q detekt-cli-1.23.6.zip

      - name: Run detekt
        run: |
          ./detekt-cli-1.23.6/bin/detekt-cli \
            --input shared/src/commonMain,shared/src/androidMain,androidApp/src/main \
            --config detekt.yml \
            --build-upon-default-config

  # ─── Segreti: a ogni livello ───────────────────────────────────────────────
  # Prendeva il posto di qa-secrets.yml, che girava su OGNI push. Gitleaks dura
  # pochi secondi e un segreto committato va intercettato prima del merge, non
  # al primo tag: per questo la scansione segreti non sta dentro `deep` ma in
  # una chiamata a parte, senza `if`, che gira anche su check e dev.
  scan-secrets:
    name: segreti
    needs: plan
    permissions:
      contents: read
    uses: Mensa-Italia/.github/.github/workflows/scan.yml@main
    with:
      secrets-scan: true
      deps-scan: false
      sbom: false

  # ─── Scansioni pesanti ─────────────────────────────────────────────────────
  # Vulnerabilita' note delle dipendenze (OSV) e SBOM. Girano ai livelli deep
  # (release e audit) E ANCHE a staging: qui staging non e' un'immagine interna,
  # e' una pubblicazione su Play beta e su TestFlight con distribuzione esterna
  # al gruppo "Test open". Prima della pipeline unica il quality gate di
  # release.yml copriva anche il track beta, quindi limitarsi ai controlli base
  # sarebbe una perdita di copertura su un artefatto che finisce a utenti veri.
  # I segreti li ha gia' scansionati `scan-secrets`: qui sarebbero un doppione.
  #
  # `deps-blocking` resta al default (true): una vulnerabilita' nota ferma la
  # pubblicazione. Il vecchio release.yml aveva Trivy senza exit-code, quindi
  # segnalava e basta. Se il primo tag dovesse inciampare su un advisory gia'
  # presente, la scelta consapevole e' aggiungere `deps-blocking: false` qui,
  # non togliere il job dai needs.
  deep:
    needs: plan
    if: needs.plan.outputs.deep == 'true' || needs.plan.outputs.tier == 'staging'
    permissions:
      # Solo contents: read. scan.yml usa i binari di gitleaks e osv-scanner e
      # non carica SARIF: il `security-events: write` che serviva al riusabile
      # di osv-scanner non ha piu' motivo di esistere.
      contents: read
    uses: Mensa-Italia/.github/.github/workflows/scan.yml@main
    with:
      secrets-scan: false
      deps-scan: true
      sbom: true
      # Bloccante a ogni livello. Le 69 vulnerabilita' che osv-scanner
      # riportava (run 31633267972) stavano tutte in npm — astro, vite,
      # esbuild, postcss, sharp, ws, yaml — cioe' la web app, che non c'e'
      # piu'. Su Gradle/Maven e CocoaPods gli advisory erano zero.
      #
      # Di npm resta solo `tools/storekit`, lo strumento degli screenshot per
      # gli store: gira sul Mac di chi pubblica e non entra in nessun
      # artefatto. Le sue eccezioni stanno in `tools/storekit/osv-scanner.toml`,
      # una per advisory e con una data di revisione — non in un
      # `deps-blocking: false` che spegne il cancello per tutti.
      #
      # Questo `true` ha gia' fermato una beta (b22.1.0, run 32581243501) su un
      # advisory di `extract-zip` transitivo di puppeteer. E' il
      # comportamento voluto: un advisory nuovo lo si guarda, non lo si
      # scavalca in silenzio.
      deps-blocking: true

  # ─── CodeQL: resta locale, e NON blocca ────────────────────────────────────
  # scan.yml non lo include: linguaggi e permessi sono specifici del repo.
  #
  # Tutti e tre sono `continue-on-error` e NON compaiono nei needs dei job che
  # pubblicano. L'organizzazione e' sul piano free senza GitHub Advanced
  # Security: l'upload dei risultati risponde 403
  # (GET /repos/Mensa-Italia/mensa_italia_app/code-scanning/alerts -> 403), quindi
  # un CodeQL dentro il cancello di `publish` renderebbe `publish` irraggiungibile
  # per sempre. Restano perche' il log dell'analisi e' comunque leggibile.
  #
  # DA RIMETTERE BLOCCANTI quando l'organizzazione avra' Advanced Security:
  # togliere `continue-on-error` e rimettere codeql-kotlin / codeql-swift nei
  # needs e nelle if di play, testflight e publish, con `== 'success'`.
  #
  # `codeql-js` e' stato eliminato con la web app: nel repo non resta una riga
  # di JavaScript o TypeScript da analizzare.
  codeql-kotlin:
    name: CodeQL Kotlin
    needs: plan
    if: needs.plan.outputs.deep == 'true'
    runs-on: ${{ vars.LINUX_RUNNER || 'ubuntu-latest' }}
    continue-on-error: true
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with: { distribution: temurin, java-version: '21' }
      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
      # `autobuild` lancia `./gradlew assemble`, e AGP senza SDK si ferma su
      # "SDK location not found": il job falliva sempre, e non per il 403 di
      # Advanced Security che i commenti qui sopra davano per scontato.
      - name: Setup Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - uses: github/codeql-action/init@99df26d4f13ea111d4ec1a7dddef6063f76b97e9 # v4
        with: { languages: 'java-kotlin', build-mode: 'autobuild' }
      - name: Build kotlin (best-effort)
        run: |
          ./gradlew :shared:compileKotlinAndroid :androidApp:compileDebugKotlin \
            -Dorg.gradle.java.home="$JAVA_HOME" --no-daemon || true
      - uses: github/codeql-action/analyze@99df26d4f13ea111d4ec1a7dddef6063f76b97e9 # v4
        with: { category: '/language:java-kotlin' }

  codeql-swift:
    name: CodeQL Swift
    needs: plan
    if: needs.plan.outputs.deep == 'true'
    # macos-latest non ha equivalente self-hosted, e il billing macOS e'
    # bloccato. Sommato al 403 di Advanced Security, doppio motivo per
    # continue-on-error.
    runs-on: macos-latest
    continue-on-error: true
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: latest-stable
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with: { distribution: temurin, java-version: '21' }
      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
      - name: Install xcodegen
        run: brew install xcodegen
      - name: Build shared Release XCFramework (CodeQL needs the framework)
        run: |
          ./gradlew :shared:assembleSharedReleaseXCFramework \
            -Dorg.gradle.java.home="$JAVA_HOME" --no-daemon
      - name: Point project.yml to Release XCFramework
        run: |
          /usr/bin/sed -i '' \
            -e 's|/XCFrameworks/debug|/XCFrameworks/release|g' \
            -e 's|assembleSharedDebugXCFramework|assembleSharedReleaseXCFramework|g' \
            iosApp/project.yml
      - name: Generate xcodeproj
        working-directory: iosApp
        run: xcodegen generate
      - uses: github/codeql-action/init@99df26d4f13ea111d4ec1a7dddef6063f76b97e9 # v4
        with: { languages: 'swift', build-mode: 'manual' }
      - name: Build iOS (manual mode for CodeQL)
        run: |
          xcodebuild build \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            -allowProvisioningUpdates=NO || true
      - uses: github/codeql-action/analyze@99df26d4f13ea111d4ec1a7dddef6063f76b97e9 # v4
        with: { category: '/language:swift' }

  # ─── versionCode per gli store ─────────────────────────────────────────────
  # Monotonico e sopra al legacy Flutter (~21M). Lo calcolava `prepare` nel
  # vecchio release.yml; sta in un job suo perche' lo leggono sia Android che
  # iOS e la formula deve restare scritta in un posto solo.
  #
  # La base era 30M e il 13 agosto 2026 la beta b22.0.6 si e' fermata su
  # "Version code 30000901 has already been used": in quella banda ci sono gia'
  # codici piu' alti del numero di commit di oggi, quindi contare i commit non
  # basta piu' a salire. Alzando la base a 31M si riparte sopra tutto quello che
  # e' stato caricato, e la formula resta monotonica.
  # NB: e' una porta a senso unico — su Play un versionCode non si riusa e non
  # si torna indietro. Se ricapita, alzare ancora la base, non toccare il conteggio.
  version-code:
    name: versionCode
    needs: plan
    if: needs.plan.outputs.tier == 'staging' || needs.plan.outputs.tier == 'release'
    runs-on: ${{ vars.LINUX_RUNNER || 'ubuntu-latest' }}
    outputs:
      value: ${{ steps.c.outputs.value }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0
      - id: c
        run: |
          set -euo pipefail
          commit_count=$(git rev-list --count HEAD)
          echo "value=$((31000000 + commit_count))" >> "$GITHUB_OUTPUT"

  # ─── Android: AAB + APK firmati ────────────────────────────────────────────
  android:
    name: Android
    needs: [plan, check, scan-secrets, version-code]
    if: >-
      !cancelled()
      && needs.version-code.result == 'success'
      && needs.check.result == 'success'
      && needs.scan-secrets.result == 'success'
    # Runner GitHub e non LINUX_RUNNER, unico job insieme a iOS: l'immagine
    # self-hosted non ha l'Android SDK (run 31640535098) e non ha nemmeno gli
    # strumenti per installarcelo in modo affidabile — le manca perfino
    # `file(1)`. Qui l'SDK c'e' gia'. Da rimettere su LINUX_RUNNER quando
    # l'immagine includera' l'SDK.
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      VERSION_CODE: ${{ needs.version-code.outputs.value }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      # Il runner self-hosted ha il JDK ma non l'Android SDK, e senza SDK AGP
      # si ferma su "SDK location not found" appena chiede android.jar: questo
      # job non era mai riuscito a compilare (run 31640535098). L'immagine dei
      # runner GitHub l'SDK ce l'ha gia', con ANDROID_HOME impostato, quindi lo
      # installiamo qui invece di dipendere da cosa c'e' sul runner. Se un
      # giorno l'immagine self-hosted includera' l'SDK, questo step si toglie e
      # il job torna su LINUX_RUNNER.
      - name: Setup Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Write VERSION file (per gradle)
        run: |
          set -euo pipefail
          # Cintura e bretelle: plan.yml rifiuta gia' un livello release/staging
          # senza tag, ma un versionName vuoto caricato sugli store non si
          # disfa. Meglio un job rosso.
          if [ -z "${VERSION:-}" ]; then
            echo "::error::Versione vuota: non si costruisce un artefatto da pubblicare senza un tag vX.Y.Z o bX.Y.Z."
            exit 1
          fi
          echo "$VERSION" > VERSION
          echo "Building Android v$VERSION (versionCode $VERSION_CODE)"

      - name: Setup JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

      - name: Decode signing keystore
        env:
          STORE_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p androidApp/keystore
          echo "${{ secrets.KEY_JKS }}" | base64 -d > androidApp/keystore/release.jks
          # Qui c'era `file androidApp/keystore/release.jks`: sul runner
          # self-hosted `file(1)` non esiste e il job moriva con exit 127 prima
          # ancora di compilare (run 31633267972). Un accertamento diagnostico
          # non deve poter fermare una pubblicazione, e questo dice anche di
          # piu': che il base64 ha prodotto un keystore che si apre davvero con
          # la password che useremo per firmare.
          test -s androidApp/keystore/release.jks
          keytool -list -keystore androidApp/keystore/release.jks \
            -storepass "$STORE_PASSWORD" >/dev/null

      # La chiave di Google Maps finisce nel manifest via manifestPlaceholders
      # (androidApp/build.gradle.kts). Il controllo e' bloccante di proposito:
      # senza chiave l'SDK non carica le tile e la mappa esce grigia, senza
      # crash e senza errore visibile. E' andata avanti cosi' per mesi perche'
      # il default della proprieta' Gradle e' la stringa vuota e nessuno
      # passava niente: un .aab pubblicato con la mappa rotta non si ritira.
      - name: Verifica la chiave di Google Maps
        env:
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${MAPS_API_KEY:-}" ]; then
            echo "::error::Il segreto MAPS_API_KEY non e' impostato: la mappa uscirebbe grigia."
            echo "Impostalo con: gh secret set MAPS_API_KEY --repo ${{ github.repository }}"
            exit 1
          fi

      - name: Build AAB + APK
        env:
          ANDROID_STORE_FILE: ${{ github.workspace }}/androidApp/keystore/release.jks
          ANDROID_STORE_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ALIAS_PASSWORD }}
          ANDROID_KEY_ALIAS: key
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
        run: |
          ./gradlew :androidApp:bundleRelease :androidApp:assembleRelease \
            -Dorg.gradle.java.home="$JAVA_HOME" \
            -PandroidVersionCodeOverride="$VERSION_CODE" \
            -PMAPS_API_KEY="$MAPS_API_KEY" \
            --no-daemon --stacktrace

      - name: Rename artifacts
        run: |
          cp androidApp/build/outputs/bundle/release/androidApp-release.aab "mensa-italia-v${VERSION}.aab"
          cp androidApp/build/outputs/apk/release/androidApp-release.apk "mensa-italia-v${VERSION}.apk"

      - name: Cleanup keystore
        if: always()
        run: rm -f androidApp/keystore/release.jks

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: android-artifacts
          path: |
            mensa-italia-v*.aab
            mensa-italia-v*.apk
          if-no-files-found: error
          retention-days: 7

  # ─── iOS: .ipa firmato per App Store ───────────────────────────────────────
  ios:
    name: iOS
    needs: [plan, check, scan-secrets, version-code]
    if: >-
      !cancelled()
      && needs.version-code.result == 'success'
      && needs.check.result == 'success'
      && needs.scan-secrets.result == 'success'
    # macos-latest non ha equivalente self-hosted. continue-on-error finche' il
    # billing macOS e' bloccato: TOGLIERE `continue-on-error` quando si sblocca.
    runs-on: macos-latest
    continue-on-error: true
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      VERSION_CODE: ${{ needs.version-code.outputs.value }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Verifica la versione
        run: |
          set -euo pipefail
          # Stesso motivo del job Android: MARKETING_VERSION vuoto produce un
          # .ipa che App Store Connect accetta e non si ritira piu'.
          if [ -z "${VERSION:-}" ]; then
            echo "::error::Versione vuota: non si costruisce un .ipa da pubblicare senza un tag vX.Y.Z o bX.Y.Z."
            exit 1
          fi

      - name: Select latest Xcode (project.yml usa iOS 26)
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: latest-stable

      - name: Setup JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Build shared Release XCFramework
        run: |
          ./gradlew :shared:assembleSharedReleaseXCFramework \
            -Dorg.gradle.java.home="$JAVA_HOME" \
            --no-daemon --stacktrace

      - name: Setup signing keychain
        env:
          P12_BASE64: ${{ secrets.APPLE_CERT_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.APPLE_PROVISION_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
          echo "::add-mask::$KEYCHAIN_PASSWORD"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')

          CERT_PATH="$RUNNER_TEMP/dist.p12"
          echo "$P12_BASE64" | base64 -d > "$CERT_PATH"
          security import "$CERT_PATH" -P "$P12_PASSWORD" -k "$KEYCHAIN_PATH" -A -t cert -f pkcs12
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" >/dev/null

          PROFILE_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILE_DIR"
          PROFILE_PATH="$PROFILE_DIR/build.mobileprovision"
          echo "$PROFILE_BASE64" | base64 -d > "$PROFILE_PATH"

          UUID=$(/usr/libexec/PlistBuddy -c "Print :UUID" /dev/stdin <<< "$(security cms -D -i "$PROFILE_PATH")")
          NAME=$(/usr/libexec/PlistBuddy -c "Print :Name" /dev/stdin <<< "$(security cms -D -i "$PROFILE_PATH")")
          mv "$PROFILE_PATH" "$PROFILE_DIR/${UUID}.mobileprovision"

          echo "PROFILE_UUID=$UUID" >> "$GITHUB_ENV"
          echo "PROFILE_NAME=$NAME" >> "$GITHUB_ENV"
          echo "::notice::Installed profile $NAME ($UUID)"

      - name: Patch project.yml (XCFramework release + manual signing iosApp only)
        run: |
          set -euo pipefail
          # 1) Punta al Release XCFramework
          /usr/bin/sed -i '' \
            -e 's|/XCFrameworks/debug|/XCFrameworks/release|g' \
            -e 's|assembleSharedDebugXCFramework|assembleSharedReleaseXCFramework|g' \
            iosApp/project.yml
          # 2) Manual signing + profile SOLO sul target iosApp. Passare questi
          #    flag via xcodebuild CLI li propaga a TUTTI i target del workspace
          #    incluse le SPM deps (Stripe, Firebase, GoogleUtilities, nanopb...)
          #    che NON supportano provisioning profile → archive fail.
          #    Scriverli nel project.yml li tiene scoped al target iosApp.
          brew install yq
          yq -i ".targets.iosApp.settings.base.CODE_SIGN_STYLE = \"Manual\"" iosApp/project.yml
          yq -i ".targets.iosApp.settings.base.PROVISIONING_PROFILE_SPECIFIER = \"$PROFILE_NAME\"" iosApp/project.yml
          yq -i ".targets.iosApp.settings.base.CODE_SIGN_IDENTITY = \"Apple Distribution\"" iosApp/project.yml
          grep -A4 "CODE_SIGN_STYLE\|PROVISIONING_PROFILE_SPECIFIER" iosApp/project.yml | head -10

      - name: Generate xcodeproj
        working-directory: iosApp
        run: xcodegen generate

      - name: Resolve SPM dependencies
        run: |
          xcodebuild -resolvePackageDependencies \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp

      - name: Archive
        run: |
          # Niente override CODE_SIGN_STYLE / PROFILE qui: stanno gia' nel
          # project.yml scoped al target iosApp. Solo MARKETING_VERSION e
          # CURRENT_PROJECT_VERSION che sono safe da propagare.
          xcodebuild archive \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/iosApp.xcarchive" \
            MARKETING_VERSION="$VERSION" \
            CURRENT_PROJECT_VERSION="$VERSION_CODE" \
            -allowProvisioningUpdates=NO

      - name: Export IPA
        run: |
          cat > "$RUNNER_TEMP/export-options.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store</string>
            <key>teamID</key><string>6WA5D3RJBU</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>it.mensa.app</key><string>${PROFILE_NAME}</string>
            </dict>
            <key>uploadSymbols</key><true/>
            <key>compileBitcode</key><false/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/iosApp.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/export-options.plist" \
            -exportPath "$RUNNER_TEMP/ipa"
          cp "$RUNNER_TEMP/ipa"/*.ipa "mensa-italia-v${VERSION}.ipa"

      - name: Cleanup keychain
        if: always()
        run: |
          [ -n "${KEYCHAIN_PATH:-}" ] && security delete-keychain "$KEYCHAIN_PATH" || true
          rm -f "$RUNNER_TEMP/dist.p12"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ios-ipa
          path: mensa-italia-v*.ipa
          if-no-files-found: error
          retention-days: 7

  # ─── Play Store ────────────────────────────────────────────────────────────
  # Niente esce prima dei controlli. `deep` gira sia a staging che a release
  # (vedi il commento del job), quindi qui la condizione e' `== 'success'`
  # secco: nessun `|| skipped` che aprirebbe il cancello quando la scansione
  # e' rossa. I CodeQL non compaiono: sono non bloccanti finche' l'org non ha
  # Advanced Security (vedi il blocco CodeQL).
  play:
    name: Play (${{ needs.plan.outputs.tier }})
    needs: [plan, check, scan-secrets, deep, android]
    if: >-
      !cancelled()
      && needs.android.result == 'success'
      && needs.check.result == 'success'
      && needs.scan-secrets.result == 'success'
      && needs.deep.result == 'success'
    runs-on: ${{ vars.LINUX_RUNNER || 'ubuntu-latest' }}
    steps:
      - name: Download AAB
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: android-artifacts

      - name: Map track for Play
        id: track_map
        env:
          TIER: ${{ needs.plan.outputs.tier }}
        run: |
          set -euo pipefail
          case "$TIER" in
            staging) play_track="beta" ;;
            release) play_track="production" ;;
            *)       echo "::error::Livello $TIER non pubblica su Play"; exit 1 ;;
          esac
          echo "play_track=$play_track" >> "$GITHUB_OUTPUT"

      - name: Upload to Play Store
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: it.mensa.app
          releaseFiles: mensa-italia-v${{ needs.plan.outputs.version }}.aab
          track: ${{ steps.track_map.outputs.play_track }}
          status: completed
          inAppUpdatePriority: 2

  # ─── TestFlight / App Store ────────────────────────────────────────────────
  # Stesso cancello di `play`: a staging la lane beta distribuisce al gruppo
  # esterno "Test open", quindi non e' meno pubblico di una release.
  testflight:
    name: iOS publish (${{ needs.plan.outputs.tier }})
    needs: [plan, check, scan-secrets, deep, ios]
    if: >-
      !cancelled()
      && needs.ios.result == 'success'
      && needs.check.result == 'success'
      && needs.scan-secrets.result == 'success'
      && needs.deep.result == 'success'
    # macos-latest non ha equivalente self-hosted. continue-on-error finche' il
    # billing macOS e' bloccato: TOGLIERE `continue-on-error` quando si sblocca.
    runs-on: macos-latest
    continue-on-error: true
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      TIER: ${{ needs.plan.outputs.tier }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Select latest Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: latest-stable

      - name: Download IPA
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: ios-ipa

      - name: Setup ASC API key
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          KEY_B64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
        run: |
          mkdir -p ~/private_keys
          echo "$KEY_B64" | base64 -d > "$HOME/private_keys/AuthKey_${KEY_ID}.p8"

      - name: Install fastlane
        run: gem install fastlane --no-document

      - name: Write Fastfile
        run: |
          mkdir -p fastlane
          cat > fastlane/Fastfile <<'RUBY'
          default_platform(:ios)

          platform :ios do
            before_all do
              app_store_connect_api_key(
                key_id: ENV['ASC_KEY_ID'],
                issuer_id: ENV['ASC_ISSUER_ID'],
                key_filepath: ENV['ASC_KEY_PATH'],
                duration: 1200,
                in_house: false
              )
            end

            desc "Upload to TestFlight (internal only)"
            lane :alpha do
              upload_to_testflight(
                ipa: ENV['IPA_PATH'],
                skip_waiting_for_build_processing: false,
                skip_submission: true,
                changelog: "Build automatica #{ENV['VERSION']} (alpha)"
              )
            end

            desc "Upload to TestFlight + Test open group"
            lane :beta do
              upload_to_testflight(
                ipa: ENV['IPA_PATH'],
                skip_waiting_for_build_processing: false,
                distribute_external: true,
                groups: ["Test open"],
                changelog: "Build automatica #{ENV['VERSION']} (beta pubblica)",
                notify_external_testers: true
              )
            end

            desc "Upload + submit to App Store review"
            lane :production do
              upload_to_testflight(
                ipa: ENV['IPA_PATH'],
                skip_waiting_for_build_processing: false,
                skip_submission: true,
                changelog: "Build automatica #{ENV['VERSION']} (production)"
              )
              deliver(
                # Il binario l'ha gia' caricato `upload_to_testflight` qui
                # sopra. Senza questo, `deliver` prova a ricaricare lo stesso
                # IPA e App Store Connect lo rifiuta contro se stesso: "The
                # bundle version must be higher than the previously uploaded
                # version" (run 32638635004, v22.2.0 - build 31000919). Non era
                # mai emerso perche' la lane `production` non era mai girata:
                # il trigger `v*` e' rimasto spento fino ad oggi.
                skip_binary_upload: true,
                submit_for_review: true,
                automatic_release: true,
                force: true,
                skip_screenshots: true,
                skip_metadata: true,
                skip_app_version_update: false,
                precheck_include_in_app_purchases: false,
                submission_information: {
                  add_id_info_uses_idfa: false,
                  export_compliance_uses_encryption: false,
                  content_rights_contains_third_party_content: false
                }
              )
            end
          end
          RUBY

      - name: Run fastlane
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          IPA_PATH: ${{ github.workspace }}/mensa-italia-v${{ needs.plan.outputs.version }}.ipa
          FASTLANE_HIDE_CHANGELOG: '1'
          FASTLANE_DISABLE_COLORS: '1'
        run: |
          set -euo pipefail
          # staging -> lane beta, release -> lane production. La lane alpha resta
          # nel Fastfile ma nessun livello la seleziona.
          case "$TIER" in
            staging) lane="beta" ;;
            release) lane="production" ;;
            *)       echo "::error::Livello $TIER non pubblica su TestFlight"; exit 1 ;;
          esac
          # ASC_KEY_PATH va calcolato in shell — il context env: della workflow
          # NON conosce $HOME (lo deduce solo a runtime).
          export ASC_KEY_PATH="$HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          ls -la "$ASC_KEY_PATH"
          fastlane ios "$lane"

      - name: Cleanup ASC key
        if: always()
        run: rm -f "$HOME/private_keys/AuthKey_"*.p8

  # ─── Artefatti da allegare alla Release ────────────────────────────────────
  # release.yml firma un artefatto solo, quindi AAB/APK e IPA vanno uniti qui.
  bundle:
    name: artefatti Release
    needs: [plan, android, ios]
    if: >-
      !cancelled()
      && needs.plan.outputs.tier == 'release'
      && needs.android.result == 'success'
    runs-on: ${{ vars.LINUX_RUNNER || 'ubuntu-latest' }}
    steps:
      - name: Scarica AAB + APK
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: android-artifacts
          path: dist

      - name: Scarica IPA
        # Finche' i job macOS sono continue-on-error l'IPA puo' mancare: la
        # Release esce lo stesso con i soli artefatti Android.
        continue-on-error: true
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: ios-ipa
          path: dist

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-files
          path: dist
          if-no-files-found: error
          retention-days: 7

  # ─── Release firmata ───────────────────────────────────────────────────────
  # L'ultimo cancello, e il piu' stretto: controlli base, segreti, scansioni
  # pesanti e artefatti mobili devono essere tutti verdi. I CodeQL restano
  # fuori dai needs finche' l'org e' sul piano free (vedi il blocco CodeQL).
  publish:
    needs: [plan, check, scan-secrets, deep, bundle]
    if: >-
      !cancelled()
      && needs.plan.outputs.tier == 'release'
      && needs.check.result == 'success'
      && needs.scan-secrets.result == 'success'
      && needs.deep.result == 'success'
      && needs.bundle.result == 'success'
    permissions:
      contents: write
      id-token: write
    uses: Mensa-Italia/.github/.github/workflows/release.yml@main
    with:
      version: ${{ needs.plan.outputs.version }}
      artifact: release-files
      files: '*'
