name: storekit

# Genera le grafiche per gli store con `tools/storekit` e le pubblica come
# artifact del run. Non carica NIENTE da nessuna parte.
#
# Le lane `upload_screenshots` in tools/storekit/fastlane esistono e
# funzionano, ma qui non vengono mai chiamate: pubblicare su App Store Connect
# o su Play resta un gesto esplicito, fatto scaricando l'artifact. Un workflow
# che rigenera le grafiche E le pubblica sarebbe un modo per sovrascrivere la
# scheda di un'app in produzione con un run lanciato per sbaglio.
#
# Sta fuori da pipeline.yml di proposito. Quella si accende sui tag, e le
# grafiche non cambiano a ogni release: legarle li' vorrebbe dire accendere
# simulatori per mezz'ora a ogni vX.Y.Z, per riprodurre le stesse immagini.
#
# Si lancia a mano: Actions -> storekit -> Run workflow.

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Quali store
        type: choice
        options: [entrambe, ios, android]
        default: entrambe
      devices:
        description: 'Solo questi device (id separati da virgola, es. ipad-13,iphone-6-5). Vuoto = tutti quelli enabled in storekit.config.ts'
        type: string
      locales:
        description: 'Solo queste lingue (es. it,en). Vuoto = quelle in config'
        type: string
      theme:
        description: Tema grafico
        type: choice
        options: [aurora, parchment, panorama]
        default: aurora

permissions:
  contents: read

concurrency:
  group: storekit-${{ github.ref }}
  cancel-in-progress: true

env:
  # `capture` fa il login prima di fotografare. Senza queste, le scene `today`,
  # `card` e `profile` finiscono sulla schermata di accesso: storekit non si
  # ferma, avvisa e prosegue in anonimo, quindi il run resta verde e produce
  # immagini inutili. Il job `doctor` qui sotto lo dice a chiare lettere.
  #
  # Devono essere quelle di un account demo dedicato: quello che si vede nelle
  # catture finisce pubblicato sull'App Store.
  MENSA_STOREKIT_EMAIL: ${{ secrets.MENSA_STOREKIT_EMAIL }}
  MENSA_STOREKIT_PASSWORD: ${{ secrets.MENSA_STOREKIT_PASSWORD }}
  STOREKIT_THEME: ${{ inputs.theme }}
  STOREKIT_DEVICES: ${{ inputs.devices }}
  STOREKIT_LOCALES: ${{ inputs.locales }}

jobs:
  # ─── iPhone e iPad ─────────────────────────────────────────────────────────
  ios:
    name: iOS
    if: inputs.platform == 'ios' || inputs.platform == 'entrambe'
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: latest-stable

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

      # Serve anche per il solo iOS: storekit costruisce l'XCFramework con
      # `:shared:assembleSharedDebugXCFramework`, e Gradle configura comunque
      # ogni modulo, :androidApp compreso. Senza SDK la configurazione muore
      # prima di arrivare al task. Lo dice buildIosApp in capture/ios.ts.
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2

      - name: Install xcodegen
        run: brew install xcodegen

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: Chromium per l'incorniciatura
        run: |
          set -euo pipefail
          # puppeteer-core non scarica nessun browser: usa quello di sistema.
          # Le immagini macOS di GitHub hanno Chrome preinstallato, ma se
          # cambiano l'immagine meglio accorgersene qui che a meta' render.
          if [ ! -x "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" ]; then
            echo "::warning::Chrome non preinstallato, lo installo"
            brew install --cask google-chrome
          fi
          "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --version

      - name: bun install
        working-directory: tools/storekit
        run: bun install

      - name: doctor
        working-directory: tools/storekit
        # Diagnostica: non deve fermare il run, ma se le credenziali mancano
        # o manca un device type e' qui che si legge, in cima al log.
        continue-on-error: true
        run: bun run src/cli.ts doctor

      - name: Avvisa se mancano le credenziali
        run: |
          if [ -z "${MENSA_STOREKIT_EMAIL:-}" ] || [ -z "${MENSA_STOREKIT_PASSWORD:-}" ]; then
            echo "::warning::MENSA_STOREKIT_EMAIL/PASSWORD non configurate: le scene che richiedono il login verranno catturate da app non autenticata."
          fi

      - name: Genera le grafiche iOS
        working-directory: tools/storekit
        run: |
          set -euo pipefail
          args=(--platform ios)
          if [ -n "${STOREKIT_THEME:-}" ]; then args+=(--theme "$STOREKIT_THEME"); fi
          if [ -n "${STOREKIT_DEVICES:-}" ]; then args+=(--devices "$STOREKIT_DEVICES"); fi
          if [ -n "${STOREKIT_LOCALES:-}" ]; then args+=(--locales "$STOREKIT_LOCALES"); fi

          echo "storekit capture/render ${args[*]}"
          bun run src/cli.ts capture "${args[@]}"
          bun run src/cli.ts render "${args[@]}"
          # Impagina out/fastlane/ios nell'albero che `deliver` si aspetta:
          # e' l'artifact da cui parte un upload manuale senza rinominare
          # niente a mano.
          bun run src/cli.ts deliver

      - name: Cosa e' stato prodotto
        if: always()
        run: |
          cd tools/storekit
          find out/store out/fastlane -type f \( -name '*.png' -o -name '*.jpg' -o -name '*.txt' \) 2>/dev/null \
            | sort | sed 's|^|  |' || echo "  niente"

      - name: Pubblica le grafiche iOS
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: storekit-ios
          # `store/` sono le immagini finite, `fastlane/` e' l'albero pronto
          # per deliver. Le catture grezze (out/raw) restano fuori: pesano e
          # non servono a chi scarica per caricare a mano.
          path: |
            tools/storekit/out/store/ios/**
            tools/storekit/out/fastlane/ios/**
          if-no-files-found: error
          retention-days: 30

  # ─── Telefono e tablet Android ─────────────────────────────────────────────
  android:
    name: Android
    if: inputs.platform == 'android' || inputs.platform == 'entrambe'
    # arm64: la system image in config e' `arm64-v8a`, che su un runner Intel
    # girerebbe in emulazione pura e non finirebbe mai.
    runs-on: macos-latest
    timeout-minutes: 120
    # L'emulatore Android su runner macOS ospitati e' la parte fragile di tutto
    # questo: senza accelerazione hardware il boot va in timeout. Non deve
    # portarsi dietro gli artifact iOS, che sono quelli che servono davvero.
    continue-on-error: true
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2

      - name: Emulatore e system image
        run: |
          set -euo pipefail
          # storekit crea da solo l'AVD (avdmanager), ma i pacchetti devono
          # esistere prima. La system image e' la stessa dichiarata in
          # storekit.config.ts: se cambia li', cambia qui.
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager --install \
            "platform-tools" \
            "emulator" \
            "system-images;android-35;google_apis;arm64-v8a"

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: Chromium per l'incorniciatura
        run: |
          set -euo pipefail
          if [ ! -x "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" ]; then
            brew install --cask google-chrome
          fi

      - name: bun install
        working-directory: tools/storekit
        run: bun install

      - name: Genera le grafiche Android
        working-directory: tools/storekit
        run: |
          set -euo pipefail
          args=(--platform android)
          if [ -n "${STOREKIT_THEME:-}" ]; then args+=(--theme "$STOREKIT_THEME"); fi
          if [ -n "${STOREKIT_DEVICES:-}" ]; then args+=(--devices "$STOREKIT_DEVICES"); fi
          if [ -n "${STOREKIT_LOCALES:-}" ]; then args+=(--locales "$STOREKIT_LOCALES"); fi

          bun run src/cli.ts capture "${args[@]}"
          bun run src/cli.ts render "${args[@]}"
          bun run src/cli.ts deliver

      - name: Pubblica le grafiche Android
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: storekit-android
          path: |
            tools/storekit/out/store/android/**
            tools/storekit/out/fastlane/android/**
          if-no-files-found: warn
          retention-days: 30

  # ─── Grafiche che non richiedono un device ─────────────────────────────────
  # Feature graphic Play (1024×500) e icona 512×512 sono disegnate da zero dal
  # renderer: non guardano nessuna cattura. Girano su Linux in un paio di
  # minuti, quindi restano disponibili anche quando simulatore o emulatore si
  # rompono - che e' esattamente quando servono.
  assets:
    name: Feature graphic e icona
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: Chromium per l'incorniciatura
        run: |
          set -euo pipefail
          # Le immagini ubuntu di GitHub hanno Chrome in /usr/bin, che env.ts
          # cerca gia'. Se sparisce, si ripiega su chromium di sistema.
          if [ -x /usr/bin/google-chrome ]; then
            /usr/bin/google-chrome --version
          else
            sudo apt-get update && sudo apt-get install -y chromium-browser
            echo "STOREKIT_CHROME=/usr/bin/chromium-browser" >> "$GITHUB_ENV"
          fi

      - name: bun install
        working-directory: tools/storekit
        run: bun install

      - name: Genera feature graphic e icona
        working-directory: tools/storekit
        run: bun run src/cli.ts assets

      - name: Pubblica gli asset
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: storekit-assets
          path: tools/storekit/out/store/**
          if-no-files-found: error
          retention-days: 30
