name: iosApp
options:
  bundleIdPrefix: it.mensa
  deploymentTarget:
    # 17.0 = floor of @Observable/SwiftData-era APIs the app uses; keeps the
    # native app close to the legacy Flutter build's OS support.
    iOS: "17.0"

packages:
  Stripe:
    url: https://github.com/stripe/stripe-ios-spm
    # 25.9.0+ fixes the PaymentSheetLoader `async let` SIGABRT
    # ("freed pointer was not the last allocation") under Xcode 26.4 / Swift 6.3.
    from: 26.4.1
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: 11.0.0

targets:
  iosApp:
    type: application
    platform: iOS
    sources:
      - path: iosApp
        excludes:
          - "**/*.orig"
    info:
      path: iosApp/Info.plist
      properties:
        # Il target usa un Info.plist esplicito, quindi le impostazioni
        # INFOPLIST_KEY_* non vengono applicate: versioni e orientamenti
        # devono stare qui, altrimenti `xcodegen generate` li sostituisce con
        # i default (1.0 / 1, nessun vincolo di orientamento).
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: LaunchLogo
          UIImageRespectsSafeAreaInsets: false
        CFBundleDisplayName: Mensa
        NSCalendarsFullAccessUsageDescription: "Mensa Italia chiede accesso al tuo calendario per aggiungere eventi che ti interessano."
        NSCameraUsageDescription: "Mensa Italia usa la fotocamera per scansionare i QR dei francobolli Tableport."
        NSLocationWhenInUseUsageDescription: "Mensa Italia usa la tua posizione per mostrarti eventi vicini sulla mappa."
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLName: it.mensa.app.stripe
            CFBundleURLSchemes:
              - mensa
        UIBackgroundModes:
          - audio
          - remote-notification
          - fetch
          - processing
        BGTaskSchedulerPermittedIdentifiers:
          - it.mensa.app.spotlight-refresh
        FirebaseAppDelegateProxyEnabled: false
    settings:
      base:
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 6WA5D3RJBU
        CODE_SIGN_ENTITLEMENTS: iosApp/iosApp.entitlements
        # Mensa Italia paid team (dev@mensa.it) — canonical bundle id.
        PRODUCT_BUNDLE_IDENTIFIER: it.mensa.app
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight UIInterfaceOrientationPortraitUpsideDown"
        SWIFT_VERSION: "5.10"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        FRAMEWORK_SEARCH_PATHS: $(SRCROOT)/../shared/build/XCFrameworks/debug
        LD_RUNPATH_SEARCH_PATHS: $(inherited) @executable_path/Frameworks
        OTHER_LDFLAGS: -framework Shared -lsqlite3 -lc++
    preBuildScripts:
      - script: |
          set -eu
          cd "$SRCROOT/.."

          # Xcode non esegue il profilo di shell, quindi JAVA_HOME di solito qui
          # non c'e' e `java` e' quello di sistema. Gradle 8.10 non parte su
          # Java 24+ e muore con un messaggio opaco ("* What went wrong: 25.0.2"),
          # che Xcode riporta solo come "PhaseScriptExecution failed".
          # I keg openjdk di Homebrew sono spesso installati ma non linkati,
          # quindi cerchiamoli a mano.
          if [ -z "${JAVA_HOME:-}" ] || [ ! -x "${JAVA_HOME:-}/bin/java" ]; then
            for keg in \
              /opt/homebrew/opt/openjdk@17 \
              /opt/homebrew/opt/openjdk@21 \
              /usr/local/opt/openjdk@17 \
              /usr/local/opt/openjdk@21 \
              /Library/Java/JavaVirtualMachines/temurin-17.jdk/Contents/Home \
              /Library/Java/JavaVirtualMachines/temurin-21.jdk/Contents/Home \
              "/Applications/Android Studio.app/Contents/jbr/Contents/Home"; do
              for home in "$keg/libexec/openjdk.jdk/Contents/Home" "$keg"; do
                if [ -x "$home/bin/java" ]; then
                  JAVA_HOME="$home"
                  export JAVA_HOME
                  break 2
                fi
              done
            done
          fi

          if [ -z "${JAVA_HOME:-}" ] || [ ! -x "$JAVA_HOME/bin/java" ]; then
            echo "error: nessun JDK 17/21 utilizzabile. Installa con 'brew install openjdk@17' oppure esporta JAVA_HOME." >&2
            exit 1
          fi

          export PATH="$JAVA_HOME/bin:$PATH"
          ./gradlew :shared:assembleSharedDebugXCFramework
        name: Build Kotlin Shared
        basedOnDependencyAnalysis: false
    dependencies:
      - framework: ../shared/build/XCFrameworks/debug/Shared.xcframework
        embed: true
      - package: Stripe
        product: StripePaymentSheet
      - package: Stripe
        product: StripePaymentsUI
      - package: Stripe
        product: StripeApplePay
      - package: Firebase
        product: FirebaseMessaging
